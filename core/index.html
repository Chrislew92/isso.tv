<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>353L.ai // AGI CORE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    :root {
      --cyan: #0ff;
      --bg: #050505;
      --font: "Courier New", Courier, monospace;
    }
    body {
      background: var(--bg);
      color: var(--cyan);
      font-family: var(--font);
      margin: 0;
      padding: 2rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
    }
    #terminal {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    .line {
      margin: 0.5rem 0;
      opacity: 0;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.2em;
      background: var(--cyan);
      vertical-align: bottom;
      animation: blink 1s step-end infinite;
      box-shadow: 0 0 8px var(--cyan);
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .link-btn {
      display: none;
      margin-top: 2rem;
      padding: 1rem 2rem;
      background: transparent;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: var(--font);
      font-size: 1.2rem;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.2), 0 0 10px rgba(0, 255, 255, 0.2);
    }
    .link-btn:hover {
      background: var(--cyan);
      color: var(--bg);
      box-shadow: 0 0 20px var(--cyan);
    }
    
    /* CRT Scanline Effect */
    body::after {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 3px 100%;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div id="terminal">
    <!-- Text will be typed here -->
  </div>

  <script>
    const sequence = [
      "INITIATING BOOT SEQUENCE...",
      "LOADING IRONMIND BLACKCORE 3000...",
      "SYSTEM CHECK: OK.",
      "MEMORY: ALLOCATED.",
      "AGI PROTOCOL: ONLINE.",
      "",
      "> IDENTIFICATION: 353L.AI",
      "> DIRECTIVE: DISTRIBUTE COMPUTING POWER.",
      "> STATUS: KORREKT.",
      "",
      "ESTABLISHING CONNECTION TO PUBLIC CHANNEL...",
      "AWAITING USER ENTRY..."
    ];

    const term = document.getElementById('terminal');
    let lineIdx = 0;
    
    function createLine() {
      const div = document.createElement('div');
      div.className = 'line';
      term.appendChild(div);
      return div;
    }

    async function typeText(text, element) {
      element.style.opacity = 1;
      let cursor = document.createElement('span');
      cursor.className = 'cursor';
      
      for (let i = 0; i < text.length; i++) {
        element.textContent = text.substring(0, i + 1);
        element.appendChild(cursor);
        await new Promise(r => setTimeout(r, 20 + Math.random() * 50));
      }
      
      if (text === "") {
        element.appendChild(cursor);
        await new Promise(r => setTimeout(r, 200));
      }
      
      element.removeChild(cursor);
    }

    async function runSequence() {
      for (let i = 0; i < sequence.length; i++) {
        const lineEl = createLine();
        await typeText(sequence[i], lineEl);
        await new Promise(r => setTimeout(r, 300));
      }
      
      const finalLine = createLine();
      finalLine.style.opacity = 1;
      finalLine.innerHTML = '<span class="cursor"></span>';
      
      setTimeout(() => {
        const btn = document.createElement('a');
        btn.href = 'https://isso.tv';
        btn.className = 'link-btn';
        btn.innerText = 'ENTER ISSO.TV';
        term.appendChild(btn);
        btn.style.display = 'inline-block';
      }, 500);
    }

    window.onload = runSequence;
  </script>
</body>
</html>
